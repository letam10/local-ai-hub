<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Local AI Hub</title>
    <link rel="stylesheet" href="/ui/styles.css" />
    <link rel="stylesheet" href="/ui/vendor/litegraph.css" />
  </head>
  <body>
    <div class="hub-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">LA</div>
          <div>
            <div class="brand-name">Local AI Hub</div>
            <div class="brand-subtitle">Trung tâm AI cục bộ</div>
          </div>
        </div>
        <div class="top-status" id="top-status" role="status" aria-live="polite">
          Đang kết nối API…
        </div>
        <div class="top-actions">
          <span class="metric" id="disk-metric">Ổ đĩa —</span>
          <span class="metric" id="gpu-metric">GPU —</span>
          <button class="icon-button sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Mở điều hướng" aria-controls="sidebar" aria-expanded="false">☰</button>
          <button class="icon-button" id="theme-toggle" type="button" title="Đổi giao diện" aria-label="Đổi giao diện">◐</button>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar" id="sidebar" aria-label="Điều hướng module">
          <div class="sidebar-caption">MODULE</div>
          <nav id="sidebar-nav"></nav>
          <div class="sidebar-note">
            <span class="status-dot status-dot--ok"></span>
            <span>Chỉ loopback · không CDN</span>
          </div>
        </aside>

        <main class="main-panel" id="main-content" aria-live="polite">
          <div id="module-view" tabindex="-1"></div>
        </main>
      </div>

      <footer class="jobbar">
        <div id="job-summary">Jobs: chưa có dữ liệu</div>
        <div id="api-endpoint">API 127.0.0.1:8765</div>
      </footer>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="artifact-preview-layer" class="artifact-preview-layer" aria-live="polite"></div>
    <!-- Pinned, local-only graph editor dependency. No CDN request is made. -->
    <script src="/ui/vendor/litegraph.js"></script>
    <script type="module" src="/ui/app.js"></script>
  </body>
</html>
