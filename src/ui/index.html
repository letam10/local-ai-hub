<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Local AI Hub</title>
    <link rel="stylesheet" href="/ui/styles.css" />
    <link rel="stylesheet" href="/ui/styles/tokens.css" />
    <link rel="stylesheet" href="/ui/styles/layout.css" />
    <link rel="stylesheet" href="/ui/styles/features/catalog.css" />
    <link rel="stylesheet" href="/ui/vendor/litegraph.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="hub-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">LA</div>
          <div>
            <div class="brand-name">Local AI Hub</div>
            <div class="brand-subtitle" data-i18n="Trung tâm AI cục bộ">Trung tâm AI cục bộ</div>
          </div>
        </div>
        <div class="top-status" id="top-status" role="status" aria-live="polite">
          Đang kết nối API…
        </div>
        <div class="top-actions">
          <span class="metric" id="disk-metric">Ổ đĩa —</span>
          <span class="metric" id="gpu-metric">GPU —</span>
          <button class="icon-button sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Mở điều hướng" data-i18n-aria-label="Mở điều hướng" aria-controls="sidebar" aria-expanded="false">☰</button>
          <label class="language-picker" title="Ngôn ngữ" data-i18n-title="Ngôn ngữ">
            <span class="sr-only" data-i18n="Ngôn ngữ">Ngôn ngữ</span>
            <select id="language-select" aria-label="Ngôn ngữ" data-i18n-aria-label="Ngôn ngữ">
              <option value="vi">Tiếng Việt</option>
              <option value="en">English</option>
              <option value="zh">简体中文</option>
              <option value="ja">日本語</option>
              <option value="ko">한국어</option>
            </select>
          </label>
          <button class="icon-button" id="refresh-snapshot" type="button" title="Làm mới snapshot" aria-label="Làm mới snapshot" data-i18n-title="Làm mới snapshot" data-i18n-aria-label="Làm mới snapshot">↻</button>
          <button class="icon-button" id="theme-toggle" type="button" title="Đổi giao diện" aria-label="Đổi giao diện" data-i18n-title="Đổi giao diện" data-i18n-aria-label="Đổi giao diện">◐</button>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar" id="sidebar" aria-label="Điều hướng module" data-i18n-aria-label="Điều hướng module">
          <div class="sidebar-caption" data-i18n="MODULE">MODULE</div>
          <nav id="sidebar-nav"></nav>
          <div class="sidebar-note">
            <span class="status-dot status-dot--ok"></span>
            <span data-i18n="Chỉ loopback · không CDN">Chỉ loopback · không CDN</span>
          </div>
        </aside>

        <main class="main-panel" id="main-content" tabindex="-1">
          <div id="snapshot-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true">Snapshot received.</div>
          <div id="module-view" tabindex="-1"></div>
        </main>
      </div>

      <footer class="jobbar">
        <div id="job-summary">Jobs: chưa có dữ liệu</div>
        <div id="api-endpoint">API đang khởi động…</div>
      </footer>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="artifact-preview-layer" class="artifact-preview-layer" aria-live="polite"></div>
    <!-- Pinned, local-only graph editor dependency. No CDN request is made. -->
    <script src="/ui/vendor/litegraph.js"></script>
    <script type="module" src="/ui/app.js"></script>
    <script type="module" src="/ui/features/components/v8_control_plane.js"></script>
  </body>
</html>
