schema_version: dependency-rules.v1
direction:
  ui: [api]
  api: [services, shared, platform]
  services: [modules, platform, shared]
  modules: [platform, shared]
  platform: [shared]
  shared: []
forbidden_imports:
  - [src.shared, src.ui]
  - [src.shared, src.services]
  - [src.shared, src.modules]
  - [src.modules, src.ui]
  - [src.ui, subprocess]
  - [src.ui, pathlib.Path]
  - [src.services.api, src.ui]
  - [src.services.component_installer, src.ui]
  - [src.services.productization, src.ui]
  - [src.ui.features, src.services]
rules:
  - id: no-arbitrary-plugin-import
    text: Manifest discovery is data-only and uses a fixed allowlist.
  - id: no-raw-public-path
    text: Browser/API projections use opaque artifact/model/runtime identifiers.
  - id: no-model-at-startup
    text: Core bootstrap never loads or downloads model weights.
  - id: evidence-required
    text: File presence is not operational evidence; bounded smoke is required.
  - id: component-plan-owned
    text: Component installation, import and maintenance plans are server-owned and accept fixed IDs or opaque selection IDs only.
  - id: no-global-scan
    text: Model/runtime discovery is bounded to configured roots and known catalog leaves; no drive-wide scan is allowed.
  - id: final-catalog-disposition
    text: A catalog source is not downloadable unless its explicit disposition and pinned source policy allow it.
  - id: no-fake-operational
    text: Installed file presence never promotes a module to operational without matching bounded runtime evidence.
  - id: feature-ownership
    text: New UI business logic belongs under src/ui/features; app.js/pages.js remain composition facades.
  - id: composite-bundle-ownership
    text: Component bundles expand only catalog-owned runtime/dependency edges and apply ordered child plans; clients cannot add paths or edges.
  - id: existing-install-reuse
    text: Existing install reuse may write only a catalog-bound receipt after exact leaf/reparse validation; it never copies, redownloads or overwrites bytes.
  - id: update-delta-preservation
    text: Update activation preserves unchanged component files and a rollback slot; only the reviewed candidate leaf is replaced.
  - id: capability-graph-read-only
    text: Capability Graph V2 composes only server-owned snapshots and evidence; it cannot launch, download, import, or promote an unverified capability to operational.
  - id: component-lifecycle-v2-authority
    text: Component Lifecycle Engine V2 may create only existing V8 server-owned plans; confirmation and execution remain with the durable V8 coordinator, while unregistered lifecycle adapters stay blocked.
  - id: model-manager-v2-bounded-inventory
    text: Model Manager V2 uses bounded catalog observations and opaque locations only; it blocks duplicate downloads, never scans all Models at page load, and delegates any import/reuse/verify/remove action to an existing V8 plan.
  - id: resource-scheduler-server-owned
    text: Resource Scheduler V2 accepts only a server-owned inventory/profile and exact internal job-worker identity; it reserves capacity without probing GPU or launching a worker, while browsers can inspect only read-only projections.
