schema_version: ui-feature-ownership.v1
facade_policy:
  pages_js: compatibility_composition_only
  app_js: bootstrap_navigation_state_only
features:
  - id: dashboard
    owner: src/ui/features/dashboard/
    api_dependencies: [bootstrap, capabilities, storage, jobs, productization, resource_scheduler]
    state_owner: app.dashboard_snapshot
    styles: src/ui/styles.css
    i18n_namespace: dashboard
    tests: [tests/test_dashboard_information_layout.py, tests/test_v5_end_to_end_productization.py, tests/test_post_v8_resource_scheduler.py]
    related_services: [src/services/api, src/services/productization, src/services/resource_scheduler]
  - id: projects
    owner: src/ui/features/projects/
    api_dependencies: [creative, workflow_library, artifacts]
    state_owner: app.creative_workspace
    styles: src/ui/styles.css
    i18n_namespace: projects
    tests: [tests/test_v5_unified_workspace.py, tests/test_v5_end_to_end_productization.py]
    related_services: [src/services/creative_workspace, src/services/artifact_store]
  - id: workflow_library
    owner: src/ui/features/workflow_library/
    api_dependencies: [workflow_library]
    state_owner: app.workflow_library
    styles: src/ui/styles.css
    i18n_namespace: workflow_library
    tests: [tests/test_v5_unified_workspace.py]
    related_services: [src/services/workflow_library]
  - id: jobs
    owner: src/ui/features/jobs/
    api_dependencies: [jobs, durable_jobs, durable_job_engine_v2, artifacts]
    state_owner: app.jobs
    styles: src/ui/styles.css
    i18n_namespace: jobs
    tests: [tests/test_v5_job_recovery_artifact_ui.py, tests/test_v6_durable_output_atomicity.py, tests/test_post_v8_durable_job_engine_v2.py]
    related_services: [src/services/api/jobs, src/services/durable_job_engine_v2, src/services/artifact_store]
  - id: artifacts
    owner: src/ui/features/artifacts/
    api_dependencies: [artifacts]
    state_owner: app.artifacts
    styles: src/ui/styles.css
    i18n_namespace: artifacts
    tests: [tests/test_v6_durable_output_atomicity.py]
    related_services: [src/services/artifact_store]
  - id: settings
    owner: src/ui/features/settings/
    api_dependencies: [settings, readiness, storage]
    state_owner: app.settings
    styles: src/ui/styles.css
    i18n_namespace: settings
    tests: [tests/test_v5_readiness_module_ui.py, tests/test_ui_polish.py]
    related_services: [src/services/api/config, src/services/productization]
  - id: diagnostics
    owner: src/ui/features/diagnostics/
    api_dependencies: [diagnostics]
    state_owner: app.diagnostics
    styles: src/ui/styles.css
    i18n_namespace: diagnostics
    tests: [tests/test_v7_final_productization.py]
    related_services: [src/services/diagnostics]
  - id: components
    owner: src/ui/features/components/
    api_dependencies: [productization, component_manager, capability_graph, component_lifecycle]
    state_owner: app.components
    styles: src/ui/styles.css
    i18n_namespace: components
    tests: [tests/test_v7_final_productization.py, tests/test_component_installer_manager.py, tests/test_post_v8_capability_graph_v2.py, tests/test_post_v8_component_lifecycle_engine.py]
    related_services: [src/services/component_installer, src/services/productization, src/services/capability_graph, src/services/component_lifecycle_engine]
  - id: models
    owner: src/ui/features/models/
    api_dependencies: [productization, models, model_manager_v2]
    state_owner: app.models
    styles: src/ui/styles.css
    i18n_namespace: models
    tests: [tests/test_v7_final_productization.py, tests/test_post_v8_model_manager_v2.py]
    related_services: [src/services/model_manager, src/services/model_manager_v2, src/services/productization]
  - id: runtimes
    owner: src/ui/features/runtimes/
    api_dependencies: [productization, runtimes]
    state_owner: app.runtimes
    styles: src/ui/styles.css
    i18n_namespace: runtimes
    tests: [tests/test_v7_final_productization.py, tests/test_runtime_manager.py]
    related_services: [src/services/runtime_manager, src/services/productization]
  - id: updates
    owner: src/ui/features/updates/
    api_dependencies: [updates, components, productization]
    state_owner: app.updateCenter
    styles: src/ui/styles.css
    i18n_namespace: updates
    tests: [tests/test_v7_operational_source_updates.py, tests/test_v7_bundle_reuse.py]
    related_services: [src/services/operational_closure, src/services/component_installer]
  - id: node_studio
    owner: src/ui/features/node_studio/
    api_dependencies: [workflow_library, node_graph]
    state_owner: app.node_studio
    styles: src/ui/styles.css
    i18n_namespace: node_studio
