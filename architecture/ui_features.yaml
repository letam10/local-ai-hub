    related_services: [src/modules/image_generation, src/services/api/jobs]
  - id: image_mask
    owner: src/ui/features/image_mask/
    api_dependencies: [image_mask, artifacts, projects]
    state_owner: app.image_mask
    styles: src/ui/styles.css
    i18n_namespace: image_mask
    tests: [tests/test_milestone6_image_mask_studio.py]
    related_services: [src/services/image_mask_studio, src/services/artifact_store]
  - id: sam2
    owner: src/ui/features/sam2/
    api_dependencies: [jobs, artifacts, capabilities]
    state_owner: app.sam2
    styles: src/ui/styles.css
    i18n_namespace: sam2
    tests: [tests/test_sam2_artifact_contract.py]
    related_services: [src/modules/sam2, src/services/api/jobs]
  - id: animesr
    owner: src/ui/features/animesr/
    api_dependencies: [jobs, artifacts, capabilities]
    state_owner: app.animesr
    styles: src/ui/styles.css
    i18n_namespace: animesr
    tests: [tests/test_video_runtime_contract.py]
    related_services: [src/modules/animesr, src/services/api/jobs]
  - id: media
    owner: src/ui/features/media/
    api_dependencies: [jobs, artifacts, media_evidence]
    state_owner: app.media
    styles: src/ui/styles.css
    i18n_namespace: media
    tests: [tests/test_video_runtime_contract.py, tests/test_v6_capability_evidence_ui.py]
    related_services: [src/services/api/jobs, src/modules/media_editor]
  - id: whisper
    owner: src/ui/features/whisper/
    api_dependencies: [jobs, artifacts, capabilities]
    state_owner: app.whisper
    styles: src/ui/styles.css
    i18n_namespace: whisper
    tests: [tests/test_whisper_first_party_contract.py]
    related_services: [src/modules/whisper, src/services/api/jobs]
  - id: vision
    owner: src/ui/features/vision/
    api_dependencies: [jobs, artifacts, capabilities]
    state_owner: app.vision
    styles: src/ui/styles.css
    i18n_namespace: vision
    tests: [tests/test_vision_voice_adapter_contract.py]
    related_services: [src/modules/vision, src/services/api/jobs]
  - id: voice
    owner: src/ui/features/voice/
    api_dependencies: [jobs, artifacts, capabilities]
    state_owner: app.voice
    styles: src/ui/styles.css
    i18n_namespace: voice
    tests: [tests/test_vision_voice_adapter_contract.py]
    related_services: [src/modules/voice, src/services/api/jobs]
  - id: ocr
    owner: src/ui/features/ocr/
    api_dependencies: [jobs, artifacts, capabilities]
    state_owner: app.ocr
    styles: src/ui/styles.css
    i18n_namespace: ocr
    tests: [tests/test_vision_voice_adapter_contract.py]
    related_services: [src/modules/ocr, src/services/api/jobs]
