schema_version: architecture-ownership.v1
layers:
  app:
    owner: [src/app/]
    allowed_dependencies: [platform, shared, services]
    forbidden: [src/modules/, src/ui/feature-business-logic]
  ui:
    owner: [src/ui/]
    allowed_dependencies: [api]
    forbidden: [filesystem, subprocess, model-weights, workstation-paths]
  api:
    owner: [src/services/api/]
    allowed_dependencies: [services, shared, platform]
    forbidden: [ui, direct-inference, arbitrary-path-input]
  services:
    owner: [src/services/]
    allowed_dependencies: [modules, platform, shared]
    forbidden: [ui, raw-public-paths]
  modules:
    owner: [src/modules/]
    allowed_dependencies: [platform, shared, artifact_store, job_manager]
    forbidden: [ui, global-lifecycle, project-database, arbitrary-subprocess]
  platform:
    owner: [src/platform/]
    allowed_dependencies: [shared]
    forbidden: [ui, services, modules]
  shared:
    owner: [src/shared/]
    allowed_dependencies: []
    forbidden: [ui, services, modules]
domains:
  artifact_store:
    owner: [src/services/artifact_store.py]
    depends_on: [platform, shared]
    forbidden: [Models, Environments, user-media-delete]
  job_manager:
    owner: [src/services/job_manager/]
    depends_on: [artifact_store, platform, shared]
    forbidden: [direct-model-download, UI-state]
  model_manager:
    owner: [src/services/model_manager/]
    depends_on: [platform.paths, artifact_store]
    forbidden: [inference, silent-download, secrets]
  runtime_manager:
    owner: [src/services/runtime_manager/]
    depends_on: [platform.paths, process-manager]
    forbidden: [model-weights, driver-CUDA-change]
  component_installer:
    owner: [src/services/component_installer/]
    depends_on: [model_manager, runtime_manager, platform.paths, shared]
    forbidden: [browser-path-input, arbitrary-command, startup-download, secret-logging]
  productization:
    owner: [src/services/productization/]
    depends_on: [component_installer, model_manager, runtime_manager, platform.paths, shared]
    forbidden: [inference, startup-download, arbitrary-path-input, driver-CUDA-change]
  component_api:
    owner: [src/services/api/components.py]
    depends_on: [component_installer, shared]
    forbidden: [raw-path-input, raw-url-input, direct-filesystem-ui]
  capability_graph:
    owner: [src/services/capability_graph/]
    depends_on: [shared]
    forbidden: [ui, raw-public-paths, provider-execution, startup-download, model-load]
  component_lifecycle_engine:
    owner: [src/services/component_lifecycle_engine/]
    depends_on: [capability_graph, component_installer, shared]
    forbidden: [ui, raw-public-paths, direct-provider-execution, startup-download, model-load]
  model_manager_v2:
    owner: [src/services/model_manager_v2/]
    depends_on: [capability_graph, component_lifecycle_engine, model_manager, productization, shared]
    forbidden: [ui, raw-public-paths, recursive-model-scan, direct-download, model-load, destructive-remove]
  resource_scheduler:
    owner: [src/services/resource_scheduler/]
    depends_on: [shared]
    forbidden: [ui, gpu-probe, worker-launch, provider-execution, browser-reservation-input]
  sam2:
    owner: [src/modules/sam2/]
    depends_on: [artifact_store, job_manager]
    model_requirements: [sam2.1-hiera-small]
  animesr:
    owner: [src/modules/animesr/]
    depends_on: [artifact_store, job_manager]
    model_requirements: [animesr-v2]
  whisper:
    owner: [src/modules/whisper/, Services/Whisper/]
    depends_on: [artifact_store, job_manager]
    model_requirements: [faster-whisper-large-v3]
  image_generation:
    owner: [src/modules/image_generation/]
    depends_on: [artifact_store, job_manager]
    model_requirements: [flux-2-klein-base-4b-fp8, qwen-image-2512-fp8]
filesystem:
  source: APP_ROOT
  mutable: [DATA_ROOT, Config, Models, Environments, runtime, Output, Cache, Temp, Logs, Reports]
  forbidden_source_contents: [*.safetensors, *.ckpt, *.pt, *.pth, *.onnx, *.gguf]
ui_features:
  owner: src/ui/features/
  facade: [src/ui/app.js, src/ui/pages.js]
  forbidden: [filesystem, subprocess, raw_server_path, dynamic_i18n_of_snapshot]
