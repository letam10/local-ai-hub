name: Repository validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: repository-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lightweight repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tracked repository files
        run: python scripts/ci_validate.py
      - name: Run V8 foundation contract tests
        run: python -m unittest discover -s tests -p "test_v8_*.py"
      - name: Run Post-V8 integration contract tests
        run: python -m unittest discover -s tests -p "test_post_v8_*.py"
      - name: Run M2 AIRI managed-launch contract tests
        run: python -m unittest tests.test_m2_airi_managed_launch
      - name: Run V8 release policy source preflight
        run: python scripts/v8_release_provenance.py --source-only
      - name: Run V8 acceptance source preflight
        run: python scripts/v8_acceptance_gate.py --source-only
      - name: Check all UI JavaScript syntax
        run: |
          shopt -s globstar nullglob
          files=(src/ui/**/*.js)
          if ((${#files[@]} == 0)); then
            echo "No UI JavaScript files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done
          echo "Checked ${#files[@]} UI JavaScript files."
      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
      - name: Check push whitespace
        if: github.event_name == 'push'
        run: git diff --check HEAD^ HEAD

  build-stable-launcher-windows:
    name: Build stable Windows launcher
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact validated source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install launcher builder
        run: python -m pip install pyinstaller
      - name: Build onedir stable launcher
        run: python scripts/build_stable_launcher.py --output-dir dist/stable-launcher
      - name: Bind launcher artifact to source head
        shell: pwsh
        run: |
          $bundle = "dist/stable-launcher/dist/LocalAIHub"
          $exe = Join-Path $bundle "LocalAIHub.exe"
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Stable launcher executable is missing" }
          $info = [ordered]@{
            schema_version = "local-ai-hub-stable-launcher-build.v1"
            source_commit = (git rev-parse HEAD).Trim()
            workflow_run_id = [int]$env:GITHUB_RUN_ID
            format = "onedir"
            executable_sha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $rows = @(
            Get-ChildItem -LiteralPath $bundle -File -Recurse | Sort-Object FullName | ForEach-Object {
              $relative = $_.FullName.Substring($bundle.Length + 1).Replace('\', '/')
              [ordered]@{
                name = $relative
                size = [int64]$_.Length
                sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
          )
          $info.files = $rows
          $info.file_count = $rows.Count
          $info.total_bytes = ($rows | Measure-Object -Property size -Sum).Sum
          $canonical = $rows | ConvertTo-Json -Compress -Depth 6
          $bytes = [Text.Encoding]::UTF8.GetBytes($canonical + "`n")
          $sha = [Security.Cryptography.SHA256]::Create()
          $info.tree_manifest_sha256 = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          $info | ConvertTo-Json -Compress -Depth 8 | Set-Content -LiteralPath "dist/stable-launcher/launcher-build.json" -Encoding utf8
          Compress-Archive -Path "$bundle/*" -DestinationPath "dist/LocalAIHub-stable-launcher-onedir.zip" -CompressionLevel Optimal
      - name: Upload stable launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-hub-stable-launcher-windows
          path: |
            dist/LocalAIHub-stable-launcher-onedir.zip
            dist/stable-launcher/launcher-build.json
          if-no-files-found: error
          retention-days: 30

  build-main-update:
    name: Build stable main update artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact validated main source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deterministic APP_ONLY payload
        run: python scripts/build_main_update.py --output dist/main-update
      - name: Upload main update artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-hub-app-payload
          path: |
            dist/main-update/LocalAIHub-main-update.zip
            dist/main-update/update-manifest.json
            dist/main-update/update-contract.json
            dist/main-update/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  assemble-main-update:
    name: Assemble same-run composite product update
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-main-update, build-stable-launcher-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact validated main source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact app payload artifact
        uses: actions/download-artifact@v4
        with:
          name: local-ai-hub-app-payload
          path: dist/app-payload
      - name: Download exact Windows launcher artifact
        uses: actions/download-artifact@v4
        with:
          name: local-ai-hub-stable-launcher-windows
          path: dist/stable-launcher
      - name: Assemble composite product artifact
        run: python scripts/assemble_product_update.py --app-artifact-dir dist/app-payload --launcher-artifact-dir dist/stable-launcher --output dist/main-update --workflow-run-id "${{ github.run_id }}"
      - name: Upload composite product artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-hub-main-update
          path: |
            dist/main-update/LocalAIHub-main-update.zip
            dist/main-update/update-manifest.json
            dist/main-update/update-contract.json
            dist/main-update/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
