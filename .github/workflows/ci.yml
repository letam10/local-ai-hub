name: Repository validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # ``github.sha`` is the synthetic PR merge ref for pull_request events.  The
  # integration job below intentionally keeps that ref, while build jobs use
  # the immutable PR head so candidate metadata is tied to the review source.
  EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: repository-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lightweight repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tracked repository files
        run: python scripts/ci_validate.py
      - name: Run V8 foundation contract tests
        run: python -m unittest discover -s tests -p "test_v8_*.py"
      - name: Run Post-V8 integration contract tests
        run: python -m unittest discover -s tests -p "test_post_v8_*.py"
      - name: Run M2 AIRI managed-launch contract tests
        run: python -m unittest tests.test_m2_airi_managed_launch
      - name: Run PR124 provenance regression tests
        run: python -m unittest tests.test_post124_build_provenance
      - name: Run V8 release policy source preflight
        run: python scripts/v8_release_provenance.py --source-only
      - name: Run V8 acceptance source preflight
        run: python scripts/v8_acceptance_gate.py --source-only
      - name: Check all UI JavaScript syntax
        run: |
          shopt -s globstar nullglob
          files=(src/ui/**/*.js)
          if ((${#files[@]} == 0)); then
            echo "No UI JavaScript files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done
          echo "Checked ${#files[@]} UI JavaScript files."
      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
      - name: Check push whitespace
        if: github.event_name == 'push'
        run: git diff --check HEAD^ HEAD

  validate-artifact-source:
    name: Validate exact artifact source
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out immutable artifact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate expected source identity and tracked files
        run: python scripts/ci_validate.py --expected-source-sha "$EXPECTED_SOURCE_SHA"
      - name: Check exact-source updater syntax
        run: node --check src/ui/app_update_bootstrap.js
      - name: Run exact-source provenance regression tests
        run: python -m unittest tests.test_post124_build_provenance

  build-stable-launcher-windows:
    name: Build stable Windows launcher
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [validate, validate-artifact-source]
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install launcher builder
        run: python -m pip install pyinstaller
      - name: Build onedir stable launcher
        run: python scripts/build_stable_launcher.py --output-dir dist/stable-launcher --expected-source-sha "$EXPECTED_SOURCE_SHA" --workflow-run-id "$GITHUB_RUN_ID"
      - name: Bind launcher artifact to source head
        shell: pwsh
        run: |
          $bundle = (Resolve-Path -LiteralPath "dist/stable-launcher/dist/LocalAIHub").Path
          $exe = Join-Path $bundle "LocalAIHub.exe"
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Stable launcher executable is missing" }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SOURCE_SHA) { throw "Launcher checkout does not match expected source SHA" }
          $metadata = Get-Content -LiteralPath "dist/stable-launcher/launcher-build.json" -Raw | ConvertFrom-Json
          if ($metadata.source_commit -ne $env:EXPECTED_SOURCE_SHA) { throw "Launcher metadata source SHA mismatch" }
          if ([int64]$metadata.workflow_run_id -ne [int64]$env:GITHUB_RUN_ID) { throw "Launcher metadata workflow run mismatch" }
          if ($metadata.format -ne "onedir" -or [int]$metadata.file_count -lt 2 -or [int64]$metadata.total_bytes -le 0) { throw "Launcher metadata is incomplete" }
          # Include the LocalAIHub directory itself; the assembler requires
          # the archive root to remain the explicit onedir bundle identity.
          Compress-Archive -Path $bundle -DestinationPath "dist/LocalAIHub-stable-launcher-onedir.zip" -CompressionLevel Optimal
      - name: Upload stable launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-hub-stable-launcher-windows
          path: |
            dist/LocalAIHub-stable-launcher-onedir.zip
            dist/stable-launcher/launcher-build.json
          if-no-files-found: error
          retention-days: 30

  build-main-update:
    name: Build stable main update artifact
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [validate, validate-artifact-source]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact validated main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deterministic legacy APP_ONLY payload
        run: python scripts/build_main_update.py --output dist/main-update --update-kind APP_ONLY --expected-source-sha "$EXPECTED_SOURCE_SHA" --workflow-run-id "$GITHUB_RUN_ID"
      - name: Upload app payload for same-run assembly
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-hub-app-payload
          path: |
            dist/main-update/LocalAIHub-main-update.zip
            dist/main-update/update-manifest.json
            dist/main-update/update-contract.json
            dist/main-update/SHA256SUMS.txt
            dist/main-update/source-attestation.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish historical APP_ONLY production identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          # The exact de616f4 updater searches this name and accepts only the
          # old APP_ONLY manifest/contract.  Never point it at the composite.
          name: local-ai-hub-main-update
          path: |
            dist/main-update/LocalAIHub-main-update.zip
            dist/main-update/update-manifest.json
            dist/main-update/update-contract.json
            dist/main-update/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  assemble-main-update:
    name: Assemble same-run composite product update
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [build-main-update, build-stable-launcher-windows, validate-artifact-source]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact validated main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify assembler checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Download exact app payload artifact
        uses: actions/download-artifact@v4
        with:
          name: local-ai-hub-app-payload
          path: dist/app-payload
      - name: Download exact Windows launcher artifact
        uses: actions/download-artifact@v4
        with:
          name: local-ai-hub-stable-launcher-windows
          path: dist/stable-launcher
      - name: Assemble composite product artifact
        run: python scripts/assemble_product_update.py --app-artifact-dir dist/app-payload --launcher-artifact-dir dist/stable-launcher --output dist/main-update --workflow-run-id "${{ github.run_id }}" --expected-source-sha "$EXPECTED_SOURCE_SHA"
      - name: Upload composite product artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          # This identity is consumed only by the new updater.  It is distinct
          # from the historical APP_ONLY artifact above.
          name: local-ai-hub-composite-product-update
          path: |
            dist/main-update/LocalAIHub-main-update.zip
            dist/main-update/update-manifest.json
            dist/main-update/update-contract.json
            dist/main-update/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload non-production PR composite candidate
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          # PR/dispatch candidates must never be discoverable as a production
          # main artifact, even when the ZIP contents are otherwise valid.
          name: pr-${{ github.run_id }}-local-ai-hub-composite-candidate
          path: |
            dist/main-update/LocalAIHub-main-update.zip
            dist/main-update/update-manifest.json
            dist/main-update/update-contract.json
            dist/main-update/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
