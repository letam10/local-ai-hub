name: Repository validation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Lightweight repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tracked repository files
        run: python scripts/ci_validate.py
      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
      - name: Check push whitespace
        if: github.event_name == 'push'
        run: git diff --check HEAD^ HEAD
